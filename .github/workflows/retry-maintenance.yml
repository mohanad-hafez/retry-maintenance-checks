name: Retry maintenance
on:
  push:
    branches: [replacement-retry-reset-01]
    paths: [.github/retry-ready]
permissions:
  contents: read
concurrency:
  group: retry-maintenance
  cancel-in-progress: false
jobs:
  reset:
    if: github.repository == 'mohanad-hafez/retry-maintenance-checks'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check routing boundaries
        run: node --test .github/scripts/retry_reset.test.cjs
      - name: Apply retry command
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          retries: 0
          script: |
            const {reset}=require(process.env.GITHUB_WORKSPACE+'/.github/scripts/retry_reset.cjs');
            await reset({github,context,commentId:6714479457});
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: retry-maintenance
          path: retry-result.json
          retention-days: 7
