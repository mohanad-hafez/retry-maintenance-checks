name: Post-merge maintenance
on:
  push:
    branches: [replacement-postmerge-01]
    paths: [.github/postmerge-ready]
permissions:
  contents: read
concurrency:
  group: postmerge-maintenance
  cancel-in-progress: false
jobs:
  closeout:
    if: github.repository == 'mohanad-hafez/retry-maintenance-checks'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check closeout boundaries
        run: node --test .github/postmerge/postmerge.test.cjs
      - name: Record merged issue closeout
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          retries: 0
          script: |
            const {closeout}=require(process.env.GITHUB_WORKSPACE+'/.github/postmerge/postmerge.cjs');
            await closeout({github,context,mergeShas:['6c657b90c5c7bda2a567712fddc1a2d1ea12c544'],expectedBase:'replacement-postmerge-01'});
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: postmerge-maintenance
          path: postmerge-result.json
          retention-days: 14
